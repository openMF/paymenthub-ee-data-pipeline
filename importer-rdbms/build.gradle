// NOTE: no 'io.spring.dependency-management' plugin, on purpose — see the note in
// importer-es/build.gradle. It resolved to the same versions here (this module has
// no Elasticsearch client), but it is dropped in all three modules so the BOM is
// the single source of versions everywhere. Do not add it back.
plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '3.4.4'
}

repositories {
    maven { url = uri('https://repo.spring.io/milestone') }
    maven { url = uri('https://repo.maven.apache.org/maven2/') }

    // The PH-EE BOM is published here by the paymenthub-ee-core repository.
    maven { url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local') }
}

dependencies {
    // The PH-EE BOM pins Spring Boot 3.4, EclipseLink 4, Jakarta EE 10 and
    // every other shared library version. Do NOT hardcode managed versions below.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    api enforcedPlatform("org.mifos:paymenthub-ee-bom:${bomVersion}")

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.yaml:snakeyaml'
    api 'org.springframework.boot:spring-boot-actuator'
    api 'org.apache.kafka:kafka-streams'
    api 'org.springframework.kafka:spring-kafka'
    api 'org.json:json'
    // Javalin 5.6.2 removed: it targets Jetty 11, but Spring Boot 3.4 (via the BOM)
    // forces Jetty 12, causing NoSuchMethodError at startup. The port 5000 healthcheck
    // now uses the JDK built-in com.sun.net.httpserver.HttpServer (no external dependency).
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.eclipse.persistence:org.eclipse.persistence.jpa'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    api 'com.jayway.jsonpath:json-path'
    // mysql:mysql-connector-java was relocated to com.mysql:mysql-connector-j
    api 'com.mysql:mysql-connector-j'
    api 'org.postgresql:postgresql'
    api 'com.zaxxer:HikariCP'
    api 'org.apache.commons:commons-text:1.10.0'
    // AWS SDK v1 is actually used (AwsStorageConfig). The v1 -> v2 migration is
    // a code rewrite (different packages), out of scope for this surgical PR.
    implementation 'com.amazonaws:aws-java-sdk:1.11.486'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // compileOnly: Lombok is an annotation processor, it must not end up in the jar.
    compileOnly 'org.projectlombok:lombok'
    // annotationProcessor is its own resolvable configuration: it does not extend
    // api/implementation, so it does not see the platform above and needs its own.
    annotationProcessor enforcedPlatform("org.mifos:paymenthub-ee-bom:${bomVersion}")
    annotationProcessor 'org.projectlombok:lombok'
}

group = 'hu.dpc.phee'
description = 'importer-rdbms'
java.sourceCompatibility = JavaVersion.VERSION_21

// No publishing block: this module is consumed as a Docker image, not as a Maven
// dependency, and the one it used to carry declared no repository, so it published
// nowhere. The version below only labels the jar inside the image.

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

// The 3 test classes are JUnit 5. Without this Gradle uses the JUnit 4 runner and
// silently runs none of them, so the build was green with zero tests executed.
test {
    useJUnitPlatform()
}

// Deterministic boot jar name so the Dockerfile can copy exactly one file
// (avoids the *.jar glob picking up the plain -plain.jar when `build` runs).
bootJar {
    archiveFileName = 'app.jar'
}
