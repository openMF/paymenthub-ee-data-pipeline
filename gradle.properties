# Project-wide Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8

# ─────────────────────────────────────────────────────────────────────────────
# PUBLISHED COORDINATES
# Every build script reads them from here — change these lines and nothing else
# needs to change.
# ─────────────────────────────────────────────────────────────────────────────
group=org.mifos
# Same version string the merged paymenthub-ee-* component repos use.
version=2.0.0.mifos-SNAPSHOT
exporterArtifact=paymenthub-ee-exporter

# ─────────────────────────────────────────────────────────────────────────────
# PLATFORM VERSIONS
# Only the BOM coordinates live here. Every library version comes from the BOM
# (org.mifos:paymenthub-ee-bom), published by the paymenthub-ee-core repository.
# ─────────────────────────────────────────────────────────────────────────────
bomVersion=2.0.0-SNAPSHOT
# paymenthub-ee-core (the former ph-ee-connector-common). The BOM does not manage
# its own sibling, so zeebe-ops needs the version explicitly.
coreVersion=2.0.0-SNAPSHOT
